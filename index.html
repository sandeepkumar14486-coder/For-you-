<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe6f2 0%, #ffb3d9 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.2);
            width: 90%;
            max-width: 600px;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #ff69b4;
            font-size: 3rem;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.2rem;
            color: #ff85c1;
            margin-bottom: 20px;
        }

        .btn {
            background: #ff69b4;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
            display: inline-block;
        }

        .btn:hover {
            background: #ff1493;
            transform: scale(1.05);
        }

        /* STRICTLY HIDING PAGES */
        .page {
            display: none; 
            animation: fadeIn 1s;
        }

        /* ONLY ACTIVE PAGE WILL SHOW */
        .active-page {
            display: block !important;
        }

        #timer {
            font-size: 2rem;
            font-weight: 600;
            color: #ff1493;
            margin: 20px 0;
        }

        .sparkle-bg {
            background: url('https://i.gifer.com/origin/79/7918a0edccdb805903b118b6283ff1c8_w200.gif');
            background-size: cover;
        }

        .song-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }

        .song-btn {
            background: #ffe6f2;
            color: #ff1493;
            border: 2px solid #ffb3d9;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .song-btn:hover, .song-btn.selected {
            background: #ff69b4;
            color: white;
            border-color: #ff69b4;
        }

        #typewriter-text {
            font-size: 1rem;
            line-height: 1.6;
            text-align: left;
            margin-top: 20px;
            min-height: 250px;
            color: #555;
            white-space: pre-wrap;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- PAGE 1: Timer & Lock -->
    <div id="page1" class="container active-page">
        <div id="lock-screen">
            <h1>Special Surprise</h1>
            <h2>Locked until July 8, 2025</h2>
            <div id="timer">Loading...</div>
        </div>
        <div id="unlock-screen" style="display: none;">
            <h1>Happy Birthday! 🎈</h1>
            <p>The wait is over...</p>
            <button class="btn" id="open-btn">Open Sparkles ✨</button>
        </div>
    </div>

    <!-- PAGE 2: Song Selection -->
    <div id="page2" class="container page">
        <h1>Choose a Vibe</h1>
        <h2>Select a song to continue...</h2>
        
        <div class="song-options">
            <button class="song-btn" onclick="selectSong('tum_hi_ho', this)">1. Tum Hi Ho</button>
            <button class="song-btn" onclick="selectSong('bhula_dena', this)">2. Bhula Dena Mujhe</button>
            <button class="song-btn" onclick="selectSong('sitaare', this)">3. Sitaare</button>
        </div>

        <audio id="tum_hi_ho" src="tum_hi_ho.mp3"></audio>
        <audio id="bhula_dena" src="bhula_dena.mp3"></audio>
        <audio id="sitaare" src="sitaare.mp3"></audio>

        <p id="wait-msg" style="display: none; color: #ff69b4; margin-top: 10px;">Feel the music...</p>
        <button class="btn" id="next-to-msg-btn" onclick="goToMessage()" style="display: none;">Next</button>
    </div>

    <!-- PAGE 3: Final Message -->
    <div id="page3" class="container page">
        <h1>Happy Birthday</h1>
        <h2>Important Message</h2>
        <div id="typewriter-text"></div>
    </div>

    <script>
        // --- TIMER LOGIC ---
        // Maine ise wapas 2025 kar diya hai taaki tum testing kar sako.
        // Jab testing complete ho jaye, toh ise 2026 zaroor kar dena!
        const countDownDate = new Date("July 8, 2025 00:00:00").getTime();

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            if (distance > 0) {
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("timer").innerHTML = days + "d " + hours + "h " + minutes + "m " + seconds + "s ";
            } else {
                clearInterval(x);
                document.getElementById("lock-screen").style.display = "none";
                document.getElementById("unlock-screen").style.display = "block";
                document.body.classList.add("sparkle-bg");
            }
        }, 1000);

        // --- STRICT PAGE TRANSITION LOGIC ---
        // Yeh function ensure karega ki sirf ek hi page dikhe
        function switchPage(hidePageId, showPageId) {
            document.getElementById(hidePageId).style.display = "none";
            document.getElementById(hidePageId).classList.remove("active-page");
            
            document.getElementById(showPageId).style.display = "block";
            document.getElementById(showPageId).classList.add("active-page");
        }

        // Button 1 (Open Sparkles)
        document.getElementById("open-btn").addEventListener("click", () => {
            document.body.classList.remove("sparkle-bg"); 
            switchPage("page1", "page2"); // Page 1 band, Page 2 shuru
        });

        // --- MUSIC LOGIC ---
        let currentAudio = null;
        let songSelected = false;

        function selectSong(audioId, btnElement) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            let buttons = document.querySelectorAll('.song-btn');
            buttons.forEach(btn => btn.classList.remove('selected'));

            btnElement.classList.add('selected');
            songSelected = true;

            currentAudio = document.getElementById(audioId);
            currentAudio.play().catch(e => console.log("Audio play error"));

            document.getElementById("wait-msg").style.display = "block";
            document.getElementById("next-to-msg-btn").style.display = "none";
            
            setTimeout(() => {
                document.getElementById("wait-msg").style.display = "none";
                document.getElementById("next-to-msg-btn").style.display = "inline-block";
            }, 2500);
        }

        // Button 2 (Next after song)
        function goToMessage() {
            if (!songSelected) return;

            switchPage("page2", "page3"); // Page 2 band, Page 3 shuru
            startTypewriter();
        }

        // --- TYPEWRITER LOGIC ---
        const messageText = "I know we are just friends, but while I am merely a friend to you, you were something much more to me. I am aware that there is someone else in your life, yet I still care for you; I don't know why I feel such a strong attraction to you. I try my best to stay out of your life, but you neither forget me nor let me forget you. Please do just one small thing for me: never message me—unless it is absolutely urgent, in which case I will always be available for you, because the heart always wins over the mind. Also, please never cross paths with me; I will never intrude into your life again. Perhaps I am just a friend to you, but please forget that friendship from this day forward. I am sorry for writing this.\n\nso start a new journey on this birthday. Happy birthday 🎈";
        
        let i = 0;
        const speed = 40; 

        function startTypewriter() {
            if (i < messageText.length) {
                document.getElementById("typewriter-text").innerHTML += messageText.charAt(i);
                i++;
                setTimeout(startTypewriter, speed);
            }
        }
    </script>
</body>
</html>
