<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Countdown</title>
    <style>
        /* Animated Mixed Color Gradient Background */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a18cd1, #fbc2eb);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Countdown Box Styling */
        #countdown-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 40px 60px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #countdown-container h2 {
            margin-top: 0;
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        #countdown {
            display: flex;
            gap: 25px;
            margin-top: 20px;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-box .number {
            font-size: 4rem;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
        }

        .time-box span {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 5px;
            opacity: 0.9;
        }

        /* Canvas for Particle Animation */
        canvas {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="countdown-container">
        <h2>Midnight Surprise In</h2>
        <div id="countdown">
            <div class="time-box"><div class="number" id="hours">00</div><span>Hours</span></div>
            <div class="time-box"><div class="number" id="minutes">00</div><span>Minutes</span></div>
            <div class="time-box"><div class="number" id="seconds">00</div><span>Seconds</span></div>
        </div>
    </div>

    <canvas id="birthdayCanvas"></canvas>

    <script>
        // Target Date Set to July 8, 2026, 00:00:00 (Midnight)
        const targetDate = new Date('July 8, 2026 00:00:00').getTime();

        const countdownContainer = document.getElementById('countdown-container');
        const canvas = document.getElementById('birthdayCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        let animationActive = false;

        // --- Countdown Timer Logic ---
        const timerInterval = setInterval(() => {
            const currentDate = new Date().getTime();
            const distance = targetDate - currentDate;

            if (distance <= 0) {
                // Timer is over, hide countdown and show animation
                clearInterval(timerInterval);
                countdownContainer.style.display = 'none';
                canvas.style.display = 'block';
                startBirthdayAnimation();
            } else {
                // Calculate time left
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('hours').innerText = String(hours).padStart(2, '0');
                document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
                document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
            }
        }, 1000);

        // --- Dot-by-Dot Animation Logic ---
        function startBirthdayAnimation() {
            animationActive = true;
            
            const fontSize = Math.min(canvas.width * 0.08, 120);
            const text = "Happy Birthday 🎈";
            
            // 1. Draw text off-screen first to get pixel coordinates
            ctx.fillStyle = "white";
            ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            
            // 2. Read those pixels
            const textData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 3. Create particles (dots) where the text pixels exist
            // Step size handles dot density (4 = high detail, 8 = scattered)
            const step = 4; 
            for (let y = 0; y < textData.height; y += step) {
                for (let x = 0; x < textData.width; x += step) {
                    const alpha = textData.data[(y * textData.width + x) * 4 + 3];
                    if (alpha > 128) {
                        particles.push({
                            x: Math.random() * canvas.width,     // Start randomly scattered
                            y: Math.random() * canvas.height,
                            targetX: x,                          // Destination X
                            targetY: y,                          // Destination Y
                            speed: Math.random() * 0.05 + 0.03,  // Easing speed
                            size: 1.5                            // Size of each dot
                        });
                    }
                }
            }
            animateParticles(text, fontSize);
        }

        function animateParticles(text, fontSize) {
            if (!animationActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let allArrived = true;

            // Move each dot closer to its target
            particles.forEach(p => {
                const dx = p.targetX - p.x;
                const dy = p.targetY - p.y;
                
                p.x += dx * p.speed;
                p.y += dy * p.speed;

                // If dots haven't reached destination completely
                if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
                    allArrived = false;
                }

                ctx.fillStyle = "white";
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            if (!allArrived) {
                requestAnimationFrame(() => animateParticles(text, fontSize));
            } else {
                // Final render: Show perfect text and balloon when dots settle
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.shadowColor = "rgba(0,0,0,0.5)";
                ctx.shadowBlur = 10;
                ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            }
        }

        // Adjust canvas if window is resized (only before animation starts)
        window.addEventListener('resize', () => {
            if(!animationActive) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });
    </script>
</body>
</html>
